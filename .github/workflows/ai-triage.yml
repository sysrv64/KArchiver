name: AI Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  discussion_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write
  discussions: write
  actions: write

concurrency:
  group: ai-triage-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || github.event.comment.commit_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AI Triage Bot
        uses: sysv86/ai-triage-bot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
